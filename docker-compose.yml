services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      DB_HOST: ${DB_HOST:?Defina DB_HOST no .env}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:?Defina DB_USER no .env}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
      DB_NAME: ${DB_NAME:?Defina DB_NAME no .env}
    depends_on:
      banco:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.50
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - frontend
      - backend

  banco:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: ${DB_NAME:?Defina DB_NAME no .env}
      MYSQL_USER: ${DB_USER:?Defina DB_USER no .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    volumes:
      - dados_mysql:/var/lib/mysql
    expose:
      - "3306"
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.00
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - backend

volumes:
  dados_mysql:

networks:
  frontend:
  backend:
    internal: true
